name: Actualizar datos y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 12,23 * * *' # 09:17 y 20:17 de Argentina (UTC-3)

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Instalar dependencias de datos
        run: python -m pip install -r scripts/requirements.txt
      - name: Recuperar los últimos datos verificados
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/
        run: python scripts/restore_snapshots.py
      - name: Probar validación y recuperación de datos
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Preparar descarga de CSV públicos de turismo
        continue-on-error: true
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Actualizar fuentes y pronóstico del EMAE
        run: python scripts/update_all.py
      - name: Validar datos y trazabilidad
        run: python scripts/check_data.py
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias del sitio
        run: npm ci
      - name: Probar transformaciones y pronósticos
        run: npm test
      - name: Compilar el sitio
        run: npm run build
      - name: Revisar formato
        run: npm run format:check
      - name: Conservar datos verificados para la próxima actualización
        uses: actions/upload-artifact@v4
        with:
          name: verified-snapshots
          path: data/cache/*.json
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      - name: Preparar publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
